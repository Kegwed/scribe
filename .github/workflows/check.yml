name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Warn about hand-written cassettes
        run: |
          for file in $(grep -l '"_handwritten"' src/test/cassettes/*.json); do
            echo "::warning file=$file::hand-written LLM responses; replace them with npm run record"
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
