name: Check

# Every branch, so an integration branch is checked as soon as it's pushed, before any PR. Tags are left to
# the release workflow, which calls this one first, so nothing is published that fails here.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Packs the package, installs the tarball into an empty directory and runs scribe there.
      - name: Packaging smoke test
        if: matrix.os == 'ubuntu-latest'
        run: npm run smoke:pack
